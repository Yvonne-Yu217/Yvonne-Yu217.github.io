<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" role="img" aria-labelledby="title desc">
  <title id="title">A one-split admissions decision tree</title>
  <desc id="desc">The root asks whether GPA is above 3.7. Yes leads to four admitted applicants; no leads to four not admitted applicants.</desc>
  <rect width="720" height="236" rx="12" fill="#f8fafb"/>
  <path d="M360 81V108M360 108H178V143M360 108H542V143" fill="none" stroke="#6b7b85" stroke-width="2.5"/>
  <rect x="245" y="24" width="230" height="58" rx="10" fill="#fff" stroke="#216b8a" stroke-width="2"/>
  <text x="360" y="59" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" fill="#26343c">GPA &gt; 3.7?</text>
  <text x="253" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#216b8a">No</text>
  <text x="468" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#216b8a">Yes</text>
  <rect x="73" y="143" width="210" height="62" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/>
  <rect x="437" y="143" width="210" height="62" rx="10" fill="#fff" stroke="#216b8a" stroke-width="2"/>
  <text x="178" y="169" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#26343c">Not admitted</text>
  <text x="178" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#52626b">4 of 4 in this leaf</text>
  <text x="542" y="169" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#26343c">Admitted</text>
  <text x="542" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#52626b">4 of 4 in this leaf</text>
</svg>
