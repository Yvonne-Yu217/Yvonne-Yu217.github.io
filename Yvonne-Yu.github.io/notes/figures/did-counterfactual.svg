<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" role="img" aria-labelledby="title desc">
  <title id="title">Difference-in-differences example</title>
  <desc id="desc">Control rises from four to six percent. Treated rises from five to nine percent. A parallel-trends counterfactual would rise from five to seven percent, leaving a two-percentage-point treatment estimate.</desc>
  <rect width="720" height="336" rx="12" fill="#f8fafb"/>
  <path d="M78 20V273H648" fill="none" stroke="#52626b" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#52626b">
    <text x="51" y="253" text-anchor="end">4%</text><text x="51" y="208" text-anchor="end">5%</text>
    <text x="51" y="163" text-anchor="end">6%</text><text x="51" y="118" text-anchor="end">7%</text>
    <text x="51" y="73" text-anchor="end">8%</text><text x="51" y="28" text-anchor="end">9%</text>
    <text x="185" y="302" text-anchor="middle">Before</text><text x="535" y="302" text-anchor="middle">After</text>
    <text x="364" y="327" text-anchor="middle">Study period</text>
  </g>
  <path d="M185 248L535 158" fill="none" stroke="#667783" stroke-width="3"/>
  <path d="M185 203L535 23" fill="none" stroke="#216b8a" stroke-width="3"/>
  <path d="M185 203L535 113" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="#667783"><circle cx="185" cy="248" r="5"/><circle cx="535" cy="158" r="5"/></g>
  <g fill="#216b8a"><circle cx="185" cy="203" r="5"/><circle cx="535" cy="23" r="5"/></g>
  <circle cx="535" cy="113" r="5" fill="#b45309"/>
  <g font-family="system-ui,sans-serif" font-size="14" font-weight="600">
    <text x="549" y="28" fill="#216b8a">Treated: 9%</text>
    <text x="549" y="118" fill="#b45309">Counterfactual: 7%</text>
    <text x="549" y="163" fill="#52626b">Control: 6%</text>
  </g>
</svg>
